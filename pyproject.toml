[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niji-agent"
version = "2.30.0"
description = "Niji Agent — provider-agnostic coding agent with MCP connectors, memory, planning, subagents, and document reading"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.55.3,<3",
    "httpx>=0.27,<0.28",
    "rich>=13.0",
    "wcwidth>=0.2.13,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
documents = ["pypdf>=5,<7"]

[project.scripts]
niji = "niji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
