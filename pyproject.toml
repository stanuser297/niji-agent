[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niji-agent"
version = "0.2.3"
description = "niji-agent — powerful provider-agnostic coding agent CLI with MCP connectors, subagents, memory, planning and parallel execution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.55.3",
    "httpx>=0.27,<0.28",
    "rich>=13.0",
]

[project.scripts]
niji = "niji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
