[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niji-agent"
version = "2.5.1"
description = "niji-agent — provider-agnostic coding agent CLI with interactive setup, custom providers, diagnostics, MCP connectors, memory, planning and subagents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.55.3,<3",
    "httpx>=0.27,<0.28",
    "rich>=13.0",
]

[project.scripts]
niji = "niji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
