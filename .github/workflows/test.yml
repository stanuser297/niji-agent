name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional document support
        run: python -m pip install --upgrade pip setuptools wheel build && python -m pip install -e '.[documents]'
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src/niji tests
      - name: Verify CLI/package version
        run: python -m niji --version
      - name: Build source and wheel distributions
        run: python -m build
